<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Siswa</title>
    <style>
        body {
            background-color: #eef2f7;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .kartu {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        #judul {
            color: #090c10;
            font-size: 28px;
            margin-bottom: 20px;
            text-decoration: underline;
        }

        #nama {
            color: #040406;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .info {
            background-color: #40454d;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="kartu">
        <h1 id="judul">Profil Siswa</h1>

        <p id="nama">Nama: Aulia Lukmatul U</p>

        <div class="info">Kelas: XI TJKT 2</div>

        <div class="info">Jurusan: Teknik Jaringan Komputer dan Telekomunikasi</div>
    </div>

</body>
</html>
